<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Stub video - YouTube</title></head>
<body>
<!-- Stand-in for YouTube's watch page: a fake #movie_player exposing the player API
     methods Browser Buddy calls. Configure with window.__bbStubConfig (page.addInitScript);
     drive and inspect it through window.__bbStub. Each phase adds the methods it needs. -->
<ytd-app>
  <div id="movie_player" class="html5-video-player"><video></video></div>
</ytd-app>
<script>
(() => {
  const config = window.__bbStubConfig || {};
  const player = document.getElementById('movie_player');
  const stub = window.__bbStub = {
    calls: [],
    state: { videoId: new URLSearchParams(location.search).get('v') || 'stub1' },
    config,
  };
  const define = (name, fn) => { player[name] = (...args) => { stub.calls.push([name, ...args]); return fn(...args); }; };
  stub.callsTo = (name) => stub.calls.filter((call) => call[0] === name);

  define('getVideoData', () => ({ video_id: stub.state.videoId }));
  define('getPlayerState', () => 1);

  // Quality. A pick in YouTube's own menu also moves the user preference; Browser Buddy's
  // setPlaybackQualityRange does not (findings Q3).
  const quality = { available: [], current: 'hd720', preference: 'auto', ...(config.quality || {}) };
  define('getAvailableQualityData', () => quality.available);
  define('getPlaybackQuality', () => quality.current);
  define('getUserPlaybackQualityPreference', () => quality.preference);
  define('setPlaybackQualityRange', (min) => { if (min === 'auto') quality.preference = 'auto'; else quality.current = min; });
  stub.userSetQuality = (q) => { quality.current = q; quality.preference = q; };
  stub.driftQuality = (q) => { quality.current = q; };

  // Battery (navigator.getBattery), controllable from tests.
  const battery = Object.assign(new EventTarget(), { charging: true, level: 1 }, config.battery || {});
  Object.defineProperty(navigator, 'getBattery', { configurable: true, value: () => Promise.resolve(battery) });
  stub.setBattery = ({ charging, level }) => {
    Object.assign(battery, { charging, level });
    battery.dispatchEvent(new Event('chargingchange'));
    battery.dispatchEvent(new Event('levelchange'));
  };

  // Captions (findings Q5): the tracklist is empty until the captions module loads;
  // setOption('captions','track', entry) shows that track; unloadModule turns them off.
  const caps = { tracks: [], translationLanguages: [], on: false, track: null, ...(config.captions || {}) };
  caps.loaded = caps.on;
  define('loadModule', (name) => { if (name === 'captions') { caps.loaded = true; } });
  define('unloadModule', (name) => { if (name === 'captions') { caps.loaded = false; caps.on = false; } });
  define('getOption', (module, key) => {
    if (module !== 'captions') return undefined;
    if (key === 'tracklist') return caps.loaded ? caps.tracks : [];
    if (key === 'translationLanguages') return caps.translationLanguages;
    if (key === 'track') return caps.on && caps.track ? caps.track : {};
    return undefined;
  });
  define('setOption', (module, key, value) => { if (module === 'captions' && key === 'track') { caps.track = value; caps.on = true; caps.loaded = true; } });
  define('isSubtitlesOn', () => caps.on);
  define('toggleSubtitlesOn', () => { caps.on = true; caps.loaded = true; });
  define('toggleSubtitles', () => { caps.on = !caps.on; });
  stub.userSetCaptions = (on, languageCode) => {
    caps.on = on;
    if (languageCode) caps.track = caps.tracks.find((t) => t.languageCode === languageCode) || caps.track;
  };

  // Caption style (findings Q6). Like the real player, it reads null and refuses updates during an ad.
  let captionStyle = { background: '#080808', backgroundOpacity: 0.75, charEdgeStyle: 0, color: '#fff', fontFamily: 4, fontSizeIncrement: 0, fontStyle: 0, textOpacity: 1, windowColor: '#080808', windowOpacity: 0, ...(config.style || {}) };
  const inAd = () => player.classList.contains('ad-showing');
  define('getSubtitlesUserSettings', () => (inAd() ? null : { ...captionStyle }));
  define('updateSubtitlesUserSettings', (partial) => {
    if (inAd()) throw new TypeError("Cannot read properties of undefined (reading 'daa')");
    captionStyle = { ...captionStyle, ...partial };
  });
  stub.userSetStyle = (partial) => { captionStyle = { ...captionStyle, ...partial }; };
  stub.driftStyle = (full) => { captionStyle = { ...full }; };

  stub.loadVideo = (id) => { stub.state.videoId = id; history.pushState({}, '', '/watch?v=' + id); };
  stub.setMiniplayer = (on) => document.querySelector('ytd-app').toggleAttribute('miniplayer-is-active', on);
  stub.startAd = () => player.classList.add('ad-showing');
  stub.endAd = () => player.classList.remove('ad-showing');
})();
</script>
</body>
</html>
